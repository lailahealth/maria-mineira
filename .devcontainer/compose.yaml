name: "maria_mineira"

services:
  rails-app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile

    volumes:
    - ../../maria mineira:/workspaces/maria mineira:cached
    # The whole mise data dir: gem installs/bin live under installs/ruby/*,
    # but the shim dispatchers mise generates for them live in the separate
    # top-level shims/ dir. Caching only the former left `bin/dev` unable to
    # find `foreman` after every container recreation.
    - bundle-cache:/home/vscode/.local/share/mise
    # Keeps the Claude Code login (~/.claude/.credentials.json etc.) so it
    # survives "Rebuild Container", not just restarts. devcontainer.json's
    # postCreateCommand chowns it to vscode on first creation.
    - claude-config:/home/vscode/.claude

    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity

    # Uncomment the next line to use a non-root user for all processes.
    # user: vscode

    # Use "forwardPorts" in **devcontainer.json** to forward an app port locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: imresamu/postgis:17-3.5-alpine
    restart: unless-stopped
    networks:
    - default
    volumes:
    - postgres-data:/var/lib/postgresql/data
    environment:
        POSTGRES_USER: maria_mineira
        POSTGRES_PASSWORD: maria_mineira
        # No POSTGRES_DB: see the root docker-compose.yml for why.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maria_mineira"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  bundle-cache:
  claude-config:
